<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Farooq Anwar - Computer Science + Fintech" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050708"/><stop offset="1" stop-color="#071012"/></linearGradient>
    <radialGradient id="glow" cx="0.83" cy="0.5" r="0.4"><stop offset="0" stop-color="#007499" stop-opacity=".3"/><stop offset="1" stop-color="#007499" stop-opacity="0"/></radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082b38"/><stop offset=".5" stop-color="#0a8588"/><stop offset="1" stop-color="#234d9d"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#48e8ff" stop-opacity="0"/><stop offset=".5" stop-color="#48e8ff"/><stop offset="1" stop-color="#48e8ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#9dffd3"/><stop offset="1" stop-color="#48e8ff"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#9de0d5" stroke-opacity=".14" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="360" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- particles -->
    <g fill="#9dffd3">
      <circle cx="140" cy="360" r="1.8" opacity=".7"><animate attributeName="cy" values="370;-10" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="360" r="2.4" opacity=".5"><animate attributeName="cy" values="370;-10" dur="12s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="360" r="1.6" opacity=".6"><animate attributeName="cy" values="370;-10" dur="10s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="360" r="2" opacity=".5"><animate attributeName="cy" values="370;-10" dur="14s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="360" r="1.6" opacity=".6"><animate attributeName="cy" values="370;-10" dur="11s" begin="-9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbital planet -->
    <g transform="translate(1010 180)">
      <ellipse rx="150" ry="52" fill="none" stroke="#48e8ff" stroke-opacity=".28" transform="rotate(-15)"/>
      <ellipse rx="120" ry="120" fill="none" stroke="#9dffd3" stroke-opacity=".2" stroke-dasharray="5 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/></ellipse>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
        <circle r="78" fill="url(#planet)" stroke="#48e8ff" stroke-width="1.5"/>
        <circle cx="-26" cy="-34" r="4" fill="#d7fff1"/>
        <circle cx="30" cy="38" r="6" fill="#4d7cff"/>
        <ellipse rx="112" ry="30" fill="none" stroke="#edf7f4" stroke-opacity=".65" transform="rotate(-25)"/>
        <ellipse rx="95" ry="20" fill="none" stroke="#d2ff55" stroke-opacity=".9" transform="rotate(34)"/>
      </g>
      <rect x="-8" y="-8" width="14" height="14" fill="#050708" stroke="#9dffd3" transform="translate(-110 -70) rotate(45)"><animate attributeName="opacity" values="1;.4;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="-5" y="-5" width="10" height="10" fill="#050708" stroke="#d2ff55" transform="translate(-118 84) rotate(45)"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></rect>
    </g>

    <!-- scanline -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#scan)" opacity=".55"><animate attributeName="y" values="0;360" dur="6s" repeatCount="indefinite"/></rect>

    <!-- kicker -->
    <rect x="60" y="78" width="34" height="1.5" fill="#9dffd3"><animate attributeName="width" values="34;54;34" dur="2.4s" repeatCount="indefinite"/></rect>
    <text x="112" y="83" font-family="'DM Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#9dffd3">KENNESAW STATE UNIVERSITY 30'</text>

    <!-- name -->
    <text x="56" y="200" font-family="'Space Grotesk','Arial Black',Helvetica,Arial,sans-serif" font-size="98" font-weight="700" letter-spacing="-5" fill="#edf7f4">FAROOQ <tspan fill="none" stroke="#48e8ff" stroke-width="1.5">ANWAR</tspan></text>

    <!-- subtitle -->
    <text x="62" y="250" font-family="'DM Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22" letter-spacing="4" fill="#8aa29f">COMPUTER SCIENCE <tspan fill="#9dffd3">+</tspan> FINTECH</text>

    <!-- status -->
    <circle cx="62" cy="304" r="4" fill="#9dffd3"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="76" y="308" font-family="'DM Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#8aa29f">ONLINE  //  ATL</text>

    <rect x="0" y="357" width="1200" height="3" fill="url(#bar)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="10" fill="none" stroke="#9de0d5" stroke-opacity=".25"/>
</svg>
